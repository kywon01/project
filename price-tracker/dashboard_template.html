<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가격 추적</title>
<style>
:root {
  color-scheme: light dark;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --base: #c3c2b7;
  --ring: rgba(11, 11, 11, 0.10);
  --good: #006300;
  --series-1: #2a78d6;
  --series-2: #eb6834;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --grid: #2c2c2a;
    --base: #383835;
    --ring: rgba(255, 255, 255, 0.10);
    --good: #0ca30c;
    --series-1: #3987e5;
    --series-2: #d95926;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
  line-height: 1.45;
}
main { max-width: 1120px; margin: 0 auto; padding: 32px 16px 56px; }
h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; }
.sub { color: var(--ink-2); font-size: 14px; margin: 0; }

.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 24px 0 16px; }
.seg { display: inline-flex; border: 1px solid var(--ring); border-radius: 10px; padding: 2px; background: var(--surface); }
.seg button {
  font: inherit; font-size: 14px; color: var(--ink-2);
  background: none; border: 0; border-radius: 8px; padding: 6px 14px; cursor: pointer;
}
.seg button:hover { background: var(--grid); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--series-1); outline-offset: 1px; }
.meta { color: var(--muted); font-size: 13px; margin-left: auto; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 16px; padding: 20px; min-width: 0; }
.card-head { display: flex; align-items: center; gap: 10px; }
.key { width: 18px; height: 0; border-top: 2px solid; border-radius: 2px; flex: none; }
.card h2 { font-size: 16px; font-weight: 600; margin: 0; }
.matched { color: var(--muted); font-size: 12.5px; margin: 4px 0 0 28px; overflow-wrap: anywhere; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 20px; margin: 18px 0 8px; }
.tile-label { color: var(--ink-2); font-size: 12.5px; }
.tile-value { font-size: 20px; font-weight: 600; margin-top: 2px; white-space: nowrap; }
.tile-value.big { font-size: 30px; }
@media (max-width: 480px) { .tile-value.big { font-size: 25px; } .tile-value { font-size: 18px; } }
.tile-note { color: var(--ink-2); font-size: 12.5px; margin-top: 1px; }
.good { color: var(--good); }

.chart { position: relative; margin-top: 8px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart svg:focus-visible { outline: 2px solid var(--series-1); outline-offset: 4px; border-radius: 4px; }
.empty { color: var(--ink-2); font-size: 14px; padding: 40px 0; text-align: center; }

.tip {
  position: absolute; pointer-events: none; z-index: 2; display: none;
  background: var(--surface); border: 1px solid var(--ring); border-radius: 10px;
  padding: 8px 10px; max-width: 250px; font-size: 12.5px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
}
.tip strong { font-size: 15px; font-weight: 600; display: block; }
.tip .row { display: flex; align-items: center; gap: 6px; color: var(--ink-2); margin-top: 2px; }
.tip .row .key { width: 12px; }
.tip .m { color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

details { margin-top: 12px; border-top: 1px solid var(--grid); padding-top: 10px; }
summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
.tablewrap { max-height: 240px; overflow: auto; margin-top: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
th { color: var(--ink-2); font-weight: 500; position: sticky; top: 0; background: var(--surface); }
td.num { font-variant-numeric: tabular-nums; }
td.nm { color: var(--muted); overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <h1>가격 추적</h1>
  <p class="sub">다나와 최저가를 Apple 공식가와 비교해요</p>

  <div class="filters" id="filters" role="group" aria-label="기간">
    <div class="seg" id="seg"></div>
    <span class="meta" id="meta"></span>
  </div>

  <div class="cards" id="cards"></div>
</main>

<script>
(() => {
const DATA = __DATA__;

const NS = "http://www.w3.org/2000/svg";
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;   // 외부 값은 항상 textContent로만 넣는다
  return e;
};
const svg = (tag, attrs = {}, text) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
};
const won = n => n.toLocaleString("ko-KR") + "원";
const num = n => n.toLocaleString("ko-KR");
const p2 = n => String(n).padStart(2, "0");
const dShort = d => `${d.getMonth() + 1}/${d.getDate()}`;
const hm = d => `${p2(d.getHours())}:${p2(d.getMinutes())}`;
const dFull = d => `${dShort(d)} ${hm(d)}`;
const DAY = 86400000;

const products = DATA.products.map((p, i) => ({
  ...p,
  color: `var(--series-${i % 2 + 1})`,
  rows: p.rows.map(r => ({ ...r, t: new Date(r.at) })),
}));
const allTimes = products.flatMap(p => p.rows.map(r => r.t.getTime()));
const latest = allTimes.length ? Math.max(...allTimes) : Date.now();

const RANGES = [["7", "7일"], ["30", "30일"], ["all", "전체"]];
let range = "all";

function visible(p) {
  if (range === "all") return p.rows;
  const cutoff = latest - Number(range) * DAY;
  return p.rows.filter(r => r.t.getTime() >= cutoff);
}

function niceTicks(lo, hi, n = 4) {
  const raw = ((hi - lo) || 1) / n;
  const mag = 10 ** Math.floor(Math.log10(raw));
  const norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.floor(lo / step) * step; v <= Math.ceil(hi / step) * step + step / 2; v += step) out.push(Math.round(v));
  return out;
}

/* ---------- 차트 ---------- */
const charts = [];

function drawChart(c) {
  const { wrap, p, rows, color } = c;
  wrap.replaceChildren();
  if (!rows.length) {
    wrap.append(el("div", "empty", "이 기간에 수집된 가격이 없어요. python3 tracker.py run 으로 수집해 보세요."));
    return;
  }

  const W = Math.max(280, wrap.clientWidth), H = 250;
  const m = { l: 62, r: 22, t: 14, b: 30 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;

  const vals = rows.map(r => r.price);
  const refs = [p.official, p.target].filter(Boolean);
  const lo = Math.min(...vals, ...refs), hi = Math.max(...vals, ...refs);
  const padv = (hi - lo) * 0.12 || hi * 0.04;
  const ticks = niceTicks(Math.max(0, lo - padv), hi + padv);   // 가격은 음수가 될 수 없다
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];

  let t0 = rows[0].t.getTime(), t1 = rows[rows.length - 1].t.getTime();
  if (t0 === t1) { t0 -= DAY / 2; t1 += DAY / 2; }
  const X = t => m.l + (t - t0) / (t1 - t0) * iw;
  const Y = v => m.t + (1 - (v - y0) / (y1 - y0)) * ih;

  const root = svg("svg", {
    viewBox: `0 0 ${W} ${H}`, role: "img", tabindex: "0",
    "aria-label": `${p.name} 가격 추이. 최근 ${won(vals[vals.length - 1])}. 방향키로 지점을 옮길 수 있어요.`,
  });

  // 가로 격자선(헤어라인, 실선) + y축 눈금
  for (const v of ticks) {
    root.append(svg("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: "var(--grid)", "stroke-width": 1 }));
    root.append(svg("text", { x: m.l - 8, y: Y(v) + 4, "text-anchor": "end", "font-size": 11.5, fill: "var(--muted)" }, num(v)));
  }
  root.append(svg("line", { x1: m.l, x2: W - m.r, y1: Y(y0), y2: Y(y0), stroke: "var(--base)", "stroke-width": 1 }));

  // x축 눈금
  const span = t1 - t0, shortSpan = span < 2 * DAY;
  const labelW = shortSpan ? 92 : 40;                       // 라벨 한 개의 대략적인 폭(px)
  const nx = Math.max(2, Math.min(6, Math.floor(iw / (labelW + 24)) + 1));
  for (let i = 0; i < nx; i++) {
    const t = t0 + span * i / (nx - 1), d = new Date(t);
    root.append(svg("text", {
      x: X(t), y: H - 8, "font-size": 11.5, fill: "var(--muted)",
      "text-anchor": i === 0 ? "start" : i === nx - 1 ? "end" : "middle",
    }, shortSpan ? dFull(d) : dShort(d)));
  }

  // 기준선: 공식가(위에 라벨) / 목표가(아래에 라벨)
  const refLine = (v, label, above) => {
    root.append(svg("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: "var(--muted)", "stroke-width": 1, opacity: 0.7 }));
    root.append(svg("text", { x: m.l + 6, y: Y(v) + (above ? -5 : 13), "font-size": 11.5, fill: "var(--ink-2)", stroke: "var(--surface)", "stroke-width": 3, "paint-order": "stroke" }, `${label} ${num(v)}`));
  };
  if (p.official) refLine(p.official, "공식가", true);
  if (p.target) refLine(p.target, "목표가", false);

  // 영역(10% 워시) + 선(2px)
  const pts = rows.map(r => [X(r.t.getTime()), Y(r.price)]);
  if (pts.length > 1) {
    const line = pts.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join("");
    root.append(svg("path", { d: `${line}L${pts[pts.length - 1][0].toFixed(1)},${Y(y0)}L${pts[0][0].toFixed(1)},${Y(y0)}Z`, fill: color, opacity: 0.10 }));
    root.append(svg("path", { d: line, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
  }

  // 점(표면색 2px 링). 많으면 마지막 점만.
  const showDots = rows.length <= 60;
  pts.forEach(([x, y], i) => {
    if (showDots || i === pts.length - 1)
      root.append(svg("circle", { cx: x, cy: y, r: 4, fill: color, stroke: "var(--surface)", "stroke-width": 2 }));
  });

  // 끝점 직접 라벨 (마지막 값만)
  const [ex, ey] = pts[pts.length - 1];
  const endLabelLeft = ex > W - m.r - 56;
  root.append(svg("text", {
    x: ex, y: ey - 12, "font-size": 12.5, "font-weight": 600, fill: "var(--ink)", stroke: "var(--surface)", "stroke-width": 3, "paint-order": "stroke",
    "text-anchor": endLabelLeft ? "end" : "middle",
  }, num(rows[rows.length - 1].price)));

  // 호버 레이어
  const cross = svg("line", { y1: m.t, y2: Y(y0), stroke: "var(--base)", "stroke-width": 1, visibility: "hidden" });
  const hot = svg("circle", { r: 5, fill: color, stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" });
  const hit = svg("rect", { x: m.l, y: m.t - 8, width: iw, height: ih + 8, fill: "transparent" });
  root.append(cross, hot, hit);

  const tip = el("div", "tip");
  wrap.append(root, tip);

  let idx = -1;
  const show = i => {
    idx = Math.max(0, Math.min(rows.length - 1, i));
    const r = rows[idx], [x, y] = pts[idx];
    cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("visibility", "visible");
    hot.setAttribute("cx", x); hot.setAttribute("cy", y); hot.setAttribute("visibility", "visible");

    tip.replaceChildren();
    tip.append(el("strong", "", won(r.price)));
    const row = el("div", "row");
    const k = el("span", "key"); k.style.borderTopColor = color;
    row.append(k, el("span", "", dFull(r.t)));
    tip.append(row);
    if (r.matched) tip.append(el("div", "m", r.matched));
    tip.style.display = "block";

    const scale = wrap.clientWidth / W;           // viewBox → 실제 픽셀
    const tw = tip.offsetWidth;
    const px = x * scale;
    tip.style.left = Math.max(0, px + 14 + tw > wrap.clientWidth ? px - 14 - tw : px + 14) + "px";
    tip.style.top = (m.t * scale) + "px";
  };
  const hide = () => {
    idx = -1; tip.style.display = "none";
    cross.setAttribute("visibility", "hidden"); hot.setAttribute("visibility", "hidden");
  };
  const nearest = ev => {
    const rect = root.getBoundingClientRect();
    const vx = (ev.clientX - rect.left) * (W / rect.width);
    let best = 0, bd = Infinity;
    pts.forEach(([x], i) => { const d = Math.abs(x - vx); if (d < bd) { bd = d; best = i; } });
    return best;
  };
  hit.addEventListener("pointermove", ev => show(nearest(ev)));
  hit.addEventListener("pointerdown", ev => show(nearest(ev)));
  root.addEventListener("pointerleave", hide);
  root.addEventListener("focus", () => show(rows.length - 1));
  root.addEventListener("blur", hide);
  root.addEventListener("keydown", ev => {
    if (ev.key === "ArrowLeft") { show(idx < 0 ? rows.length - 1 : idx - 1); ev.preventDefault(); }
    else if (ev.key === "ArrowRight") { show(idx < 0 ? rows.length - 1 : idx + 1); ev.preventDefault(); }
    else if (ev.key === "Escape") hide();
  });
}

/* ---------- 카드 ---------- */
function tile(label, value, note, opts = {}) {
  const t = el("div", "tile");
  t.append(el("div", "tile-label", label));
  const v = el("div", "tile-value" + (opts.big ? " big" : ""), value);
  t.append(v);
  if (note != null) t.append(el("div", "tile-note" + (opts.good ? " good" : ""), note));
  return t;
}

function buildCard(p) {
  const rows = visible(p);
  const card = el("section", "card");

  const head = el("div", "card-head");
  const key = el("span", "key"); key.style.borderTopColor = p.color;
  head.append(key, el("h2", "", p.name));
  card.append(head);

  const last = p.rows[p.rows.length - 1];
  if (last && last.matched) card.append(el("p", "matched", last.matched));

  const tiles = el("div", "tiles");
  if (rows.length) {
    const cur = rows[rows.length - 1].price;
    tiles.append(tile("현재 최저가", won(cur), dFull(rows[rows.length - 1].t), { big: true }));

    const diff = p.official ? cur - p.official : null;
    if (diff === null) tiles.append(tile("공식가 대비", "-", null));
    else if (diff === 0) tiles.append(tile("공식가 대비", "동일", `공식가 ${won(p.official)}`));
    else if (diff < 0) tiles.append(tile("공식가 대비", `▼ ${won(-diff)}`, `${Math.round(-diff / p.official * 100)}% 저렴`, { good: true }));
    else tiles.append(tile("공식가 대비", `▲ ${won(diff)}`, `${Math.round(diff / p.official * 100)}% 비쌈`));

    if (p.target) {
      const gap = cur - p.target;
      tiles.append(gap <= 0
        ? tile("목표가까지", "도달 ✓", `목표가 ${won(p.target)}`, { good: true })
        : tile("목표가까지", won(gap), `목표가 ${won(p.target)}`));
    }
    const min = rows.reduce((a, r) => (r.price < a.price ? r : a), rows[0]);
    tiles.append(tile("기간 내 최저", won(min.price), dShort(min.t)));
  }
  card.append(tiles);

  const wrap = el("div", "chart");
  card.append(wrap);
  charts.push({ wrap, p, rows, color: p.color });

  // 표로 보기: 툴팁 없이도 모든 값에 접근 가능
  const det = el("details");
  det.append(el("summary", "", `표로 보기 (${rows.length}건)`));
  const tw = el("div", "tablewrap"), table = el("table");
  const thead = el("thead"), hr = el("tr");
  ["수집 시각", "최저가", "상품명"].forEach(h => hr.append(el("th", "", h)));
  thead.append(hr);
  const tbody = el("tbody");
  [...rows].reverse().forEach(r => {
    const tr = el("tr");
    tr.append(el("td", "", dFull(r.t)), el("td", "num", won(r.price)), el("td", "nm", r.matched));
    tbody.append(tr);
  });
  table.append(thead, tbody);
  tw.append(table); det.append(tw);
  card.append(det);
  return card;
}

function render() {
  charts.length = 0;
  const cards = document.getElementById("cards");
  cards.replaceChildren(...products.map(buildCard));
  charts.forEach(drawChart);
  document.getElementById("meta").textContent = allTimes.length
    ? `마지막 수집 ${dFull(new Date(latest))}`
    : "아직 수집된 가격이 없어요";
}

function renderFilters() {
  const seg = document.getElementById("seg");
  seg.replaceChildren(...RANGES.map(([v, label]) => {
    const b = el("button", "", label);
    b.type = "button";
    b.setAttribute("aria-pressed", String(range === v));
    b.addEventListener("click", () => { range = v; renderFilters(); render(); });
    return b;
  }));
}

renderFilters();
render();

let lastW = window.innerWidth, raf = 0;
new ResizeObserver(() => {
  if (window.innerWidth === lastW) return;
  lastW = window.innerWidth;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => charts.forEach(drawChart));
}).observe(document.body);
})();
</script>
</body>
</html>
