<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>To-do List</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <header class="app-header">
    <span class="app-icon">✅</span>
    <div>
      <h1>To-do List</h1>
      <p class="app-subtitle">오늘 할 일을 정리해보세요</p>
    </div>
  </header>

  <form id="todo-form">
    <input type="text" id="todo-input" placeholder="할 일을 입력하세요" autocomplete="off" required />
    <div class="form-row">
      <input type="date" id="due-date-input" title="마감일" />
      <select id="priority-input" title="우선순위">
        <option value="low">우선순위: 낮음</option>
        <option value="medium" selected>우선순위: 보통</option>
        <option value="high">우선순위: 높음</option>
      </select>
      <input type="text" id="category-input" placeholder="카테고리 (선택)" autocomplete="off" list="category-options" />
      <datalist id="category-options"></datalist>
    </div>
    <button type="submit">추가</button>
  </form>

  <div class="filter-bar">
    <input type="text" id="search-input" placeholder="검색..." autocomplete="off" />
    <select id="category-filter">
      <option value="">전체 카테고리</option>
    </select>
    <select id="priority-filter">
      <option value="">전체 우선순위</option>
      <option value="high">높음</option>
      <option value="medium">보통</option>
      <option value="low">낮음</option>
    </select>
  </div>

  <p id="error-message" class="error hidden"></p>

  <ul id="todo-list"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
